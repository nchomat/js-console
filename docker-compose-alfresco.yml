version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-alfresco
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - alfresco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco"]
      interval: 10s
      timeout: 5s
      retries: 5

  alfresco:
    image: alfresco/alfresco-content-repository-community:25.2.0
    container_name: alfresco-repo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Xms512m -Xmx2g
        -XX:+UseG1GC
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres-alfresco:5432/alfresco
        -Ddb.pool.initial=10
        -Ddb.pool.max=100
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.protocol=http
        -Dshare.host=localhost
        -Dshare.port=8180
        -Dshare.protocol=http
        -Daos.baseUrlOverwrite=http://localhost:8080/alfresco/aos
        -Ddeployment.method=DOCKER_COMPOSE
        -Dcsrf.filter.enabled=false
        -Dopencmis.server.override=true
        -Dopencmis.server.value=http://localhost:8080
        -Dcsrf.filter.referer=http://localhost:8080/.*
        -Dcsrf.filter.origin=http://localhost:8080
        -Ddev.email.not.sent=true
        -Demail.server.enabled=false
    ports:
      - "8080:8080"
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
      - ./javascript-console-repo/target/javascript-console-repo-0.7-SNAPSHOT.jar:/usr/local/tomcat/webapps/alfresco/WEB-INF/lib/javascript-console-repo-0.7-SNAPSHOT.jar
    networks:
      - alfresco-network

volumes:
  postgres-data:
    driver: local
  alfresco-data:
    driver: local

networks:
  alfresco-network:
    name: alfresco-network
    driver: bridge
