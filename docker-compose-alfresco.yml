version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  alfresco:
    image: alfresco/alfresco-content-repository-community:25.2.0
    depends_on:
      - postgres
    environment:
      JAVA_OPTS: >-
        -Xms512m -Xmx2g
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.protocol=http
    ports:
      - "8080:8080"
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
      - ./javascript-console-repo/target/javascript-console-repo-0.7-SNAPSHOT.jar:/usr/local/tomcat/webapps/alfresco/WEB-INF/lib/javascript-console-repo-0.7-SNAPSHOT.jar

volumes:
  postgres-data:
  alfresco-data:
